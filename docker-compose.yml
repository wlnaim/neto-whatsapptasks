# Evolution API: el "puente" entre este programa y tu WhatsApp.
# Levanta 3 contenedores: Evolution API + Postgres (guarda datos) + Redis (memoria rapida).
#
# Antes de usarlo copia .env.example a .env y rellena tus propias claves (ver README.md).
# Uso:  docker compose up -d

services:
  evolution-api:
    # Version fija a proposito (ver README, seccion "Por que la version 2.3.7").
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution_api
    restart: unless-stopped
    ports:
      # Solo tu computadora puede entrar (127.0.0.1). No lo expongas a internet.
      - "127.0.0.1:8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      # TU clave de acceso. Se define en el archivo .env; si falta, Docker avisa y no arranca.
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:?Falta EVOLUTION_API_KEY en el archivo .env}
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://postgres:${EVOLUTION_DB_PASSWORD:?Falta EVOLUTION_DB_PASSWORD en el archivo .env}@postgres:5432/evolution?schema=public
      - REDIS_URI=redis://redis:6379/1
      - REDIS_PREFIX_KEY=evolution
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/1
      - CACHE_REDIS_PREFIX_KEY=evolution
      - WEBHOOK_GLOBAL_ENABLED=false
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:15-alpine
    container_name: evolution_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${EVOLUTION_DB_PASSWORD:?Falta EVOLUTION_DB_PASSWORD en el archivo .env}
      - POSTGRES_DB=evolution
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d evolution"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:alpine
    container_name: evolution_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  evolution_instances:
  postgres_data:
  redis_data:
